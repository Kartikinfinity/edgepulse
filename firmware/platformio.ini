; SIH KWS - ESP32-S3-WROOM-1-N16R8 + INMP441
;
; CONFIGURATION ONLY. No firmware source exists yet - that is BUILD_PLAN.md
; Phase A2/A3 and is deliberately not started. This file is committed now so
; that a second machine downloads exactly the same toolchain, and so that
; `pio pkg install` is reproducible.
;
; PORTABILITY RULES FOR THIS FILE - do not break them:
;   * no absolute paths, no drive letters, no usernames
;   * no upload_port / monitor_port pinned here. Port names differ per machine
;     (COM7 on the original Windows host, /dev/ttyACM0 on Linux). PlatformIO
;     auto-detects; override per machine with the PLATFORMIO_UPLOAD_PORT
;     environment variable or `pio run -t upload --upload-port <port>`.
;   * build output goes to the default ./.pio inside this directory, which is
;     git-ignored and always on the same volume as the checkout.
;   * Wi-Fi credentials are NEVER put here. See ENVIRONMENT_SETUP.md.
;
; The PlatformIO *core* directory (toolchains, ~2.4 GB) is a per-machine tool
; install, like git or python. Leave it wherever PlatformIO puts it; only set
; PLATFORMIO_CORE_DIR if that volume is short of space.

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32@7.1.1
board = esp32-s3-devkitc-1
framework = arduino

; --- 16 MB flash (the stock board definition is the 8 MB N8 variant) --------
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv

; --- 8 MB Octal PSRAM (the stock board definition declares none) ------------
; memory_type is "<flash_mode>_<psram_type>": quad-SPI flash + octal-SPI PSRAM.
; Verified on the original board by eFuse readout: quad flash @3.3 V, so this
; is a WROOM-1-N16R8 and NOT a WROOM-2 N16R8V (which would need opi_opi).
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio

; --- TensorFlow Lite for Microcontrollers ----------------------------------
; The supplied plan names espressif/esp-tflite-micro, which is an ESP-IDF
; component and is unavailable under the Arduino framework. This Arduino port
; bundles the same ESP-NN kernels. Rationale and the measured evidence for
; staying on Arduino core 2.0.17 / ESP-IDF 4.4 are in DECISIONS.md D-003.
lib_deps =
    nickjgniklu/ESP_TF@^2.0.1

build_flags =
    -DBOARD_HAS_PSRAM
    ; --- SERIAL ROUTING: verified on the actual board, 2026-09-09 ------------
    ; THIS BOARD ENUMERATES THROUGH A CH343 USB-UART BRIDGE (COM8), *not* the
    ; ESP32-S3's native USB-Serial/JTAG (VID:PID 303A:1001). Measured directly:
    ; with ARDUINO_USB_CDC_ON_BOOT=1 the ROM bootloader was readable at 115200
    ; but the sketch's Serial output never arrived, because Serial was bound to
    ; the native USB CDC port, which is not connected on this unit.
    ;
    ; 0 => Serial binds to UART0 (GPIO 43/44) -> CH343 -> host COM port.
    ; If you move to a board that exposes the native USB port, set this to 1.
    ; GPIO 43/44 are UART0 and are NOT used by the I2S mic (4/5/6) - no conflict.
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; ESP_TF gates its ESP-NN SIMD kernels behind `#if ESP_NN` and declares no
    ; build flags, so without these two defines the REFERENCE kernels compile.
    ; On the prior build these two lines alone were worth a measured 5.48x.
    -DESP_NN=1
    -DCONFIG_IDF_TARGET_ESP32S3=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder
